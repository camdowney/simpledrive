    <!-- Login -->
    <div id="login-view" class="hidden">
      <div class="login-card">
        <h1>Drive</h1>
        <div id="login-error"></div>
        <form id="login-form" autocomplete="on">
          <input
            type="text"
            id="username-input"
            name="username"
            placeholder="Username"
            autocomplete="username"
          />
          <input
            type="password"
            id="password-input"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
          />
          <button
            type="submit"
            class="btn btn-primary btn-lg"
            id="login-btn"
            style="width: 100%; justify-content: center"
          >
            Sign in
          </button>
        </form>
      </div>
      <div class="login-footer">
        <button class="btn btn-ghost theme-toggle js-theme-toggle" aria-label="Toggle theme">
          <svg class="btn-icon theme-icon-moon" aria-hidden="true">
            <use href="#icon-moon" />
          </svg>
          <svg class="btn-icon theme-icon-sun" aria-hidden="true">
            <use href="#icon-sun" />
          </svg>
          <span class="theme-label-dark">Dark mode</span>
          <span class="theme-label-light">Light mode</span>
        </button>
      </div>
    </div>

    <!-- Revoked or expired share link -->
    <div id="share-gone" class="hidden">
      <div class="login-card">
        <h1>Link unavailable</h1>
        <p class="share-gone-message">This share link is no longer valid.</p>
      </div>
    </div>

    <!-- Main app -->
    <div id="app-view" class="hidden">
      <!-- Browser view -->
      <div id="browser-view" class="hidden">
        <div class="topbar">
          <a class="topbar-title js-home" href="#">
            <img class="topbar-logo" src="/static/favicon.svg" alt="" width="32" height="32" />
            Drive
          </a>
          <div class="header-actions">
            <button class="btn btn-ghost js-storage" title="Storage" aria-label="Storage">
              <svg class="btn-icon" aria-hidden="true">
                <use href="#icon-hard-drive" />
              </svg>
            </button>
            <button
              class="btn btn-ghost theme-toggle js-theme-toggle"
              title="Toggle theme"
              aria-label="Toggle theme"
            >
              <svg class="btn-icon theme-icon-moon" aria-hidden="true">
                <use href="#icon-moon" />
              </svg>
              <svg class="btn-icon theme-icon-sun" aria-hidden="true">
                <use href="#icon-sun" />
              </svg>
            </button>
            <button class="btn btn-ghost js-logout" title="Sign out" aria-label="Sign out">
              <svg class="btn-icon" aria-hidden="true">
                <use href="#icon-log-out" />
              </svg>
              <span class="btn-label">Sign out</span>
            </button>
          </div>
        </div>
        <div class="breadcrumb-row">
          <a class="breadcrumb-logo js-home" href="#" aria-label="Home">
            <img src="/static/favicon.svg" alt="SimpleDrive" width="30" height="30" />
          </a>
          <nav class="breadcrumb" id="breadcrumb">
            <span class="current"><span class="crumb-name">&nbsp;</span></span>
          </nav>
          <div class="crumb-popover popover" id="crumb-popover">
            <button class="popover-item" id="crumb-rename-btn">
              <svg class="btn-icon" aria-hidden="true">
                <use href="#icon-pencil" />

            </button>
            <button class="popover-item" id="crumb-tags-btn">

              </svg>

            </button>
            <button class="popover-item" id="crumb-share-btn">
              <svg class="btn-icon" aria-hidden="true">
                <use href="#icon-users" />
              </svg>
              Share
            </button>
            <button class="popover-item" id="crumb-details-btn">
              <svg class="btn-icon" aria-hidden="true">
                <use href="#icon-info" />
              </svg>
              Details
            </button>
            <button class="popover-item" id="crumb-download-btn">
              <svg class="btn-icon" aria-hidden="true">
